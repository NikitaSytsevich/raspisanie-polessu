<!DOCTYPE html>
<html class="dark" lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta id="themeColorMeta" name="theme-color" content="#181513" />
    <link rel="icon" type="image/svg+xml" href="assets/app-icon-right-v2.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon-v2.png" />
    <title>Расписание</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#d97757",
              "dark-base": "#181513",
              "dark-card": "#23201d",
              "dark-card-lighter": "#2c2824",
              "background-light": "#f5f1eb",
              "header-tint": "#23201d",
            },
            fontFamily: {
              display: ["Newsreader", "Georgia", "serif"],
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-dark-base min-h-screen antialiased pb-24">

    <div id="fetchBanner" class="fetch-banner" hidden></div>

    <div id="settingsView" hidden class="sv-view">
      <header id="settingsHeader" class="sv-header">
        <div class="sv-header-row">
          <button id="backFromSettingsButton" class="ms-icon-btn" type="button" title="Назад">
            <span class="material-symbols-outlined">arrow_back</span>
          </button>
          <div class="sv-header-copy">
            <h1>Настройки</h1>
            <p>Тема и резервная копия</p>
          </div>
        </div>
      </header>

      <main id="settingsMain" class="sv-main">
        <section class="sv-section">
          <div class="sv-section-label">Тема</div>
          <div id="themeSelector" class="sv-list">
            <button type="button" data-theme="light" class="sv-row sv-row-theme">
              <span class="sv-radio"></span>
              <span class="sv-row-label">Светлая</span>
              <span class="sv-row-meta">Ясный дневной режим</span>
            </button>
            <button type="button" data-theme="dark" class="sv-row sv-row-theme">
              <span class="sv-radio"></span>
              <span class="sv-row-label">Тёмная</span>
              <span class="sv-row-meta">Тёплый тёмный</span>
            </button>
            <button type="button" data-theme="system" class="sv-row sv-row-theme">
              <span class="sv-radio"></span>
              <span class="sv-row-label">Системная</span>
              <span class="sv-row-meta">Следует за устройством</span>
            </button>
          </div>
        </section>

        <section class="sv-section">
          <div class="sv-section-label">Данные</div>
          <div class="sv-list">
            <button id="exportMyShiftsButton" type="button" class="sv-row">
              <span class="material-symbols-outlined sv-row-icon">download</span>
              <span class="sv-row-label">Скачать JSON</span>
              <span class="sv-row-meta">Резервная копия графика</span>
              <span class="material-symbols-outlined sv-row-chev">chevron_right</span>
            </button>
            <button id="importMyShiftsButton" type="button" class="sv-row">
              <span class="material-symbols-outlined sv-row-icon">upload</span>
              <span class="sv-row-label">Загрузить JSON</span>
              <span class="sv-row-meta">Обновить график из файла</span>
              <span class="material-symbols-outlined sv-row-chev">chevron_right</span>
            </button>
            <button id="myDeleteHistoryButton" type="button" class="sv-row sv-row-danger">
              <span class="material-symbols-outlined sv-row-icon">delete</span>
              <span class="sv-row-label">Удалить историю</span>
              <span class="sv-row-meta">Очистить сохранённый график</span>
              <span class="material-symbols-outlined sv-row-chev">chevron_right</span>
            </button>
          </div>
          <input id="importMyShiftsInput" type="file" accept=".json,application/json" hidden />
          <p id="myShiftsDataNotice" hidden class="sv-notice"></p>
        </section>
      </main>
    </div>

    <div id="myScheduleView" hidden class="ms-view">
      <header id="myScheduleHeader" class="ms-header">
        <div class="ms-header-row">
          <div class="ms-brand">
            <span class="ms-brand-name">Расписание</span>
            <span id="myScheduleUpdatedAt" class="ms-brand-updated">Загрузка…</span>
          </div>
          <button id="myScheduleRefreshButton" class="ms-icon-btn" type="button" title="Обновить">
            <span id="myScheduleRefreshIcon" class="material-symbols-outlined">refresh</span>
          </button>
          <button id="openSettingsButton" class="ms-icon-btn" type="button" title="Настройки" aria-label="Настройки">
            <span class="material-symbols-outlined">tune</span>
          </button>
        </div>
      </header>

      <main id="myScheduleMain" class="ms-main">
        <section class="ms-day-section">
          <div id="myDaySpotlightHead" class="ms-day-section-head">
            <h3 id="myTimelineTitle" class="ms-day-section-title">Сегодня</h3>
            <div id="myDayInlineActions" class="ms-day-inline-actions" hidden>
              <button id="myScheduleRangeButton" type="button" class="ms-range-btn">
                <span id="myScheduleRangeIcon" class="material-symbols-outlined">open_in_full</span>
                <span id="myScheduleRangeLabel">Весь график</span>
              </button>
            </div>
          </div>
          <div id="myScheduleTimeline"></div>
        </section>

        <button id="myChangesSummaryCard" type="button" class="ms-changes-pill" aria-label="Открыть проверку расписания">
          <div id="myChangesSummaryContent"></div>
        </button>
      </main>
    </div>

    <div id="changesView" hidden class="cv-view">
      <header id="changesHeader" class="cv-header">
        <div class="cv-header-row">
          <button id="backFromChangesButton" class="ms-icon-btn" type="button" title="Назад">
            <span class="material-symbols-outlined">arrow_back</span>
          </button>
          <div class="cv-header-copy">
            <h1>Изменения</h1>
            <p id="changesUpdatedAt" class="cv-header-sub">Загрузка…</p>
          </div>
          <button id="changesRefreshButton" class="ms-icon-btn" type="button" title="Проверить">
            <span id="changesRefreshIcon" class="material-symbols-outlined">refresh</span>
          </button>
        </div>
      </header>

      <main id="changesMain" class="cv-main">
        <section id="changesLatestCard" hidden></section>
        <section id="changesUpdatesCard" class="cv-updates"></section>
      </main>
    </div>

    <div id="appSheet" class="app-sheet" hidden aria-modal="true" role="dialog">
      <div class="app-sheet-backdrop"></div>
      <div class="app-sheet-panel">
        <div class="app-sheet-handle"></div>
        <div class="app-sheet-content">
          <h3 class="app-sheet-title" id="appSheetTitle"></h3>
          <div class="app-sheet-body" id="appSheetBody"></div>
        </div>
        <div class="app-sheet-actions">
          <button type="button" class="app-sheet-cancel" id="appSheetCancel">Отмена</button>
          <button type="button" class="app-sheet-confirm" id="appSheetConfirm">Подтвердить</button>
        </div>
      </div>
    </div>

    <div id="appSnackbar" class="app-snackbar" hidden role="status" aria-live="polite">
      <span id="appSnackbarText" class="app-snackbar-text"></span>
      <button type="button" id="appSnackbarAction" class="app-snackbar-action">Отменить</button>
    </div>

    <script src="shared/site_changes.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
